name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/simulator -q
      - run: node --test
        working-directory: nodered

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: python -m json.tool grafana/dashboards/telemetry.json > /dev/null
      - run: python -m json.tool grafana/dashboards/health.json > /dev/null
      - run: python -m json.tool nodered/flows.json > /dev/null

  broker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: cp .env.example .env
      - run: bash scripts/generate-certs.sh
      - run: bash scripts/create-mqtt-users.sh device-01 device-02 device-03 device-04 device-05
      - run: docker compose up -d --wait mosquitto
      - run: pytest tests/test_broker_security.py -q
      - if: failure()
        run: docker compose logs mosquitto
      - if: always()
        run: docker compose down -v

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: cp .env.example .env
      - run: bash scripts/generate-certs.sh
      - run: bash scripts/create-mqtt-users.sh device-01 device-02 device-03 device-04 device-05
      - run: docker compose up -d --build --wait
      - run: pytest tests -q
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
