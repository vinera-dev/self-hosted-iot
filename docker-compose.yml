name: self-hosted-iot

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-11883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mosquitto-data:
