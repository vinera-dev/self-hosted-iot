name: iot

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-21883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-21432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: timescale/timescaledb:2.17.2-pg16
    entrypoint: ["sh", "/db/migrate.sh"]
    environment:
      PGHOST: timescaledb
      PGUSER: ${POSTGRES_USER:-iot}
      PGDATABASE: ${POSTGRES_DB:-iot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./db:/db:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  nodered:
    build: ./nodered
    image: iot-nodered:local
    env_file:
      - path: .secrets/nodered.env
        required: false
    environment:
      PGHOST: timescaledb
      PGUSER: ${POSTGRES_USER:-iot}
      PGDATABASE: ${POSTGRES_DB:-iot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      TZ: UTC
      TEMP_HIGH_C: ${TEMP_HIGH_C:-28}
      TEMP_LOW_C: ${TEMP_LOW_C:-25}
    volumes:
      - nodered-data:/data
      - ./nodered/flows.json:/data/flows.json:ro
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/lib:/iot/lib:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1880/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-21300}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mosquitto-data:
  nodered-data:
  grafana-data:
  timescaledb-data:
